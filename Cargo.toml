[package]
name = "feedyourai"
version = "2.1.3"
edition = "2024"
description = "A tool to combine text files for AI processing with flexible filtering options."
authors = ["Alexandre Trotel"]
homepage = "https://github.com/alexandretrotel/feedyourai"
repository = "https://github.com/alexandretrotel/feedyourai"
documentation = "https://github.com/alexandretrotel/feedyourai"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "ai", "llm", "context", "codebase"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[[bin]]
name = "fyai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
arboard = "3.6"
color-eyre = "0.6"
directories-next = "2.0"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.27"
