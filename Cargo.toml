[package]
name = "feedyourai"
version = "2.1.3"
edition = "2024"
description = "A tool to combine text files for AI processing with flexible filtering options."
authors = ["Alexandre Trotel"]
homepage = "https://github.com/alexandretrotel/feedyourai"
repository = "https://github.com/alexandretrotel/feedyourai"
documentation = "https://github.com/alexandretrotel/feedyourai"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
license = "GPL-3.0-or-later"

[[bin]]
name = "fyai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
arboard = "3.6.1"
color-eyre = "0.6.5"
directories-next = "2.0.0"
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.25.0"
