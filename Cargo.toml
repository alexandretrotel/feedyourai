[package]
name = "feedyourai"
version = "2.0.2"
edition = "2024"
description = "A tool to combine text files for AI processing with flexible filtering options."
authors = ["atrtde"]
homepage = "https://github.com/atrtde/feedyourai"
repository = "https://github.com/atrtde/feedyourai"
documentation = "https://github.com/atrtde/feedyourai"
exclude = ["assets/*", ".github/*"]
license = "GPL-3.0-or-later"

[[bin]]
name = "fyai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
arboard = "3.6.1"
directories-next = "2.0.0"
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.25.0"
thiserror = "2.0.18"
anyhow = "1.0.101"
